<!DOCTYPE html>
<html>
<head>
    <title>Gear Engine Unit Tests</title>
</head>
<body>
    <h1>Running MITCalc Web App Engine Unit Tests...</h1>
    <div id="results"></div>

    <script type="module">
        import { MathUtils } from './js/engine/math-utils.js';
        import { GearGeometry } from './js/engine/gear-geometry.js';
        import { GearForces } from './js/engine/gear-forces.js';
        import { GearStrengthISO } from './js/engine/gear-strength-iso.js';
        import { Materials } from './js/data/materials.js';

        const resultsDiv = document.getElementById('results');
        function assert(desc, actual, expected, tolerance = 0.01) {
            const diff = Math.abs(actual - expected);
            const pass = diff <= tolerance;
            const p = document.createElement('p');
            p.style.color = pass ? 'green' : 'red';
            p.innerHTML = `${pass ? '✓ PASS' : '✗ FAIL'}: <b>${desc}</b> | Actual: ${actual} | Expected: ${expected} (diff: ${diff.toFixed(6)})`;
            resultsDiv.appendChild(p);
            console.log(desc, pass ? 'PASS' : 'FAIL', actual, expected);
        }

        // Test 1: Involute and Inverse Involute
        const inv20 = MathUtils.inv(20);
        const invInv20 = MathUtils.invol(inv20);
        assert('Involute 20 deg round-trip', invInv20, 20.0, 0.0001);

        // Test 2: Standard MITCalc Gear1 Geometry (z1=19, z2=48, mn=6, alpha=20, beta=0)
        const g = GearGeometry.calculate({
            mn: 6.0,
            z1: 19,
            z2: 48,
            alfa_n: 20.0,
            beta: 0.0,
            b1: 120.0,
            b2: 117.0,
            x1: 0.0,
            x2: 0.0,
            target_i: 2.50,
            ha0: 1.25,
            hf0: 1.00,
            ra0: 0.38,
            ca_star: 0.25
        });

        assert('Reference diameter d1', g.d1, 114.0, 0.01);
        assert('Reference diameter d2', g.d2, 288.0, 0.01);
        assert('Center distance a', g.a, 201.0, 0.01);
        assert('Working center distance aw', g.aw, 201.0, 0.01);
        assert('Base diameter db1', g.db1, 107.125, 0.01);
        assert('Base diameter db2', g.db2, 270.6315, 0.01);
        assert('Root diameter df1', g.df1, 99.0, 0.01);
        assert('Root diameter df2', g.df2, 273.0, 0.01);
        assert('Tip diameter da1', g.da1, 126.0, 0.01);
        assert('Tip diameter da2', g.da2, 300.0, 0.01);
        assert('Transverse contact ratio ea', g.epsilon_A, 1.6456, 0.05);

        // Test 3: Forces
        const f = GearForces.calculate(g, {
            Pw: 100.0,
            n1: 1000.0
        });

        assert('Torque Mk1', f.Mk1, 955.0, 1.0);
        assert('Speed n2', f.n2, 395.8, 0.5);
        assert('Peripheral speed v', f.v, 5.97, 0.05);
        assert('Tangential force Ft', f.Ft, 16754.0, 50.0);

        // Test 4: ISO 6336 Rating
        const mat1 = Materials.find(m => m.id === 35) || Materials[0];
        const mat2 = mat1;
        const r = GearStrengthISO.calculate(g, f, mat1, mat2, {
            KA: 1.0,
            KAS: 2.0,
            Lh: 20000,
            accuracyGrade: 7,
            SH_req: 1.30,
            SF_req: 1.60
        });

        assert('Contact safety SH1 >= 1.0', r.SH1 >= 1.0, true, 0);
        assert('Bending safety SF1 >= 1.0', r.SF1 >= 1.0, true, 0);

        console.log('All tests finished.');
    </script>
</body>
</html>
